version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: mingalbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mingalbank
      POSTGRES_PASSWORD: mingalbank
      POSTGRES_DB: mingalbank
    ports:
      - "5432:5432"
    volumes:
      - mingalbank_postgres_data:/var/lib/postgresql/data

volumes:
  mingalbank_postgres_data:
